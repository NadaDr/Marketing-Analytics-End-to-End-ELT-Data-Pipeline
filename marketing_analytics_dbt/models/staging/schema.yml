version: 2

models:
  - name: stg_mc_channels
    description: "Cleaned marketing channel data"
    columns:
      - name: channel_id
        data_tests:
          - not_null
          - unique
      - name: channel_name
        data_tests:
          - not_null

  - name: stg_mc_campaigns
    description: "Cleaned marketing campaign data"
    columns:
      - name: campaign_id
        data_tests:
          - not_null
          - unique
      - name: channel_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_mc_channels')
              field: channel_id
      - name: campaign_name
        data_tests:
          - not_null
      - name: budget
        data_tests:
          - not_null

  - name: stg_mc_ad_groups
    description: "Cleaned advertising group data"
    columns:
      - name: ad_group_id
        data_tests:
          - not_null
          - unique
      - name: campaign_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_mc_campaigns')
              field: campaign_id

  - name: stg_mc_daily_performance
    description: "Daily advertising performance metrics"
    columns:
      - name: performance_id
        data_tests:
          - not_null
          - unique
      - name: ad_group_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_mc_ad_groups')
              field: ad_group_id
      - name: activity_date
        data_tests:
          - not_null

  - name: stg_mc_conversions
    description: "Individual marketing conversion events"
    columns:
      - name: conversion_id
        data_tests:
          - not_null
          - unique
      - name: ad_group_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_mc_ad_groups')
              field: ad_group_id
      - name: first_touch_channel_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_mc_channels')
              field: channel_id
      - name: last_touch_channel_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_mc_channels')
              field: channel_id